'use strict';

const notes=['Water density = 1 g/cm³. Treat each specimen as solid and waterproof.','Read the bottom of the meniscus at eye level. All specimens sink and become fully submerged. 1 mL = 1 cm³.','Water particles, enlarged. Keep the chosen state: phase changes are outside this model.','Useful output depends on the machine. Wasted energy spreads into the surroundings.','Discuss your explanation as a team. The teacher will confirm your reasoning.'];
let lab=0,teamNo=1,complete=[false,false,false,false,false],trial=0,s={},drag=null,audio,phaseTime=0,last=0,raf=0;
function fit(){stage.style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1600,innerHeight/900)+')'}addEventListener('resize',fit);fit();
function tone(kind='tap'){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime;const seq=kind==='good'?[523,659,784]:kind==='water'?[220,155,105]:[390];seq.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type=kind==='water'?'sine':'triangle';o.frequency.setValueAtTime(f,t+i*.09);g.gain.setValueAtTime(0,t+i*.09);g.gain.linearRampToValueAtTime(.055,t+i*.09+.01);g.gain.exponentialRampToValueAtTime(.001,t+i*.09+.22);o.connect(g).connect(audio.destination);o.start(t+i*.09);o.stop(t+i*.09+.24)})}catch(e){}}
document.addEventListener('pointerdown',()=>tone(),{once:true});
function feedback(message,type=''){const e=$('#feedback');e.textContent=message;e.className=type;if(type==='good')tone('good')}
function done(message){complete[lab]=true;progress();feedback(message,'good')}
function progress(){$('#steps').innerHTML=short.map((n,i)=>'<div class="step '+(i===lab?'active ':'')+(complete[i]?'done':'')+'" '+(i===lab?'aria-current="step"':'')+'><b>'+(complete[i]?'✓':String(i+1).padStart(2,'0'))+'</b>'+n+'</div>').join('')}

function openLab(n,intro=true){cancelAnimationFrame(raf);lab=n;trial=0;$('#labNo').textContent=n===4?'FINAL CHALLENGE':'INVESTIGATION 0'+(n+1);$('#labTitle').textContent=titles[n];$('#newTrial').hidden=n===4;$('#help').hidden=false;progress();newTrial();if(intro)showIntro()}
function newTrial(){cancelAnimationFrame(raf);trial++;s={};feedback('Discuss. Predict. Experiment. Explain.');$('#newTrial').textContent=lab===0?'↻ New specimens':lab===1?'↻ New readings':lab===2?'↻ New heat challenge':'↻ New machine';[density,displacement,particles,energy,finalLab][lab]()}
$('#begin').onclick=()=>{$('#intro').close();tone()};$('#help').onclick=showIntro;$('#newTrial').onclick=newTrial;
$('#fullscreen').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>feedback('Fullscreen is unavailable here. Open the downloaded HTML for a full-screen classroom view.'))}else document.exitFullscreen?.()};
$('#nextTeam').onclick=()=>{teamNo=teamNo%Number($('#teamCount').value)+1;$('#team').value='Team '+teamNo;tone()};
$('#teacherBtn').onclick=()=>{$('#teacherLabs').innerHTML=short.map((n,i)=>'<button data-lab="'+i+'" class="'+(i===lab?'chosen':'')+'">'+(i+1)+'<br>'+n+'</button>').join('');$('#teacherStatus').textContent=complete[lab]?'Experiment completed. Ready for the next investigation.':'An experiment is still in progress. You may move on when the class is ready.';$('#advance').textContent=lab===4?'Review explanation & complete →':'Open next laboratory →';$('#advance').disabled=lab===4&&(!s.numericOK||s.finished);$('#teacher').showModal()};
$('#teacherLabs').onclick=e=>{let b=e.target.closest('[data-lab]');if(b){$('#teacher').close();openLab(+b.dataset.lab)}};$('#closeTeacher').onclick=()=>$('#teacher').close();
$('#advance').onclick=()=>{if(s.finished)return;if(lab<4){$('#teacher').close();openLab(lab+1)}else{if(!s.numericOK)return;if(!$('#explanation').value.trim()){feedback('Add a short explanation before the teacher confirms.','try');$('#teacher').close();return}$('#teacher').close();complete[4]=true;finish()}};
$('#restart').onclick=()=>{if(confirm('Restart the investigations and clear this session’s progress?')){complete.fill(false);teamNo=1;$('#team').value='Team 1';$('#teacher').close();openLab(0)}};
$('#download').onclick=()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#stage').innerHTML=originalMain;clone.querySelectorAll('dialog').forEach(d=>d.removeAttribute('open'));clone.querySelectorAll('.ghost').forEach(e=>e.remove());const blob=new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='physics8-float-sink-energy-lab.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
const originalMain=stage.innerHTML;
function rand(a){return a[Math.floor(Math.random()*a.length)]}function num(n){return Math.round(n*100)/100}function val(id){const v=$(id).value.trim();return v===''?NaN:Number(v)}
function shape(type,color='#e7aa70',size=70){let body=type==='rock'?'<path d="M12 53L5 30 23 9 48 5 65 23 63 54 42 66 19 65Z"/>':type==='shell'?'<path d="M8 54Q1 20 27 7Q52 0 65 25Q73 46 48 63L31 67Z"/><path d="M18 49Q16 23 36 20Q57 21 52 40Q47 54 32 42" fill="none" stroke="#ffffff66" stroke-width="4"/>':type==='bolt'?'<path d="M20 6H51L65 20 51 35H44V64H27V35H20L5 20Z"/><circle cx="35" cy="20" r="7" fill="#173d49"/>':'<rect x="7" y="7" width="56" height="56" rx="9"/><path d="M8 24H62M8 44H62" stroke="#ffffff30" stroke-width="3"/>';return '<svg viewBox="0 0 70 70" width="'+size+'" height="'+size+'" aria-hidden="true"><g fill="'+color+'" stroke="#ffffff44" stroke-width="1.5">'+body+'</g></svg>'}
function svgShape(type,color,x,y,w=70,h=w){return '<g transform="translate('+x+' '+y+') scale('+w/70+' '+h/70+')">'+shape(type,color).replace(/^<svg[^>]*>|<\/svg>$/g,'')+'</g>'}
function chooseButtons(selector,key,callback){document.querySelectorAll(selector).forEach(b=>b.onclick=()=>{s[key]=b.dataset.value;document.querySelectorAll(selector).forEach(x=>x.classList.toggle('chosen',x===b));if(callback)callback();tone()})}
function density(){let vol=rand([40,50,80,100]);s.objects=[{name:'Cork',d:.25,v:vol,color:'#d9ac73'},{name:'Wood',d:.6,v:rand([50,75,100]),color:'#be8151'},{name:'Rubber',d:1.2,v:rand([40,60,80]),color:'#a6adc7'},{name:'Aluminium',d:2.7,v:rand([20,40,50]),color:'#8eabbc'}];s.index=0;s.predict='';s.tested=false;ws.innerHTML='<aside class="panel stack"><h3>Choose a specimen</h3>'+s.objects.map((o,i)=>'<button class="objectChoice '+(i===0?'chosen':'')+'" data-object="'+i+'">'+shape('block',o.color)+'<span>'+o.name+'<small>Solid · waterproof</small></span></button>').join('')+'<span class="badge">Water · 1 g/cm³</span></aside><div class="sim" id="tank"><span class="simlabel">Float tank / side view</span><svg viewBox="0 0 740 500" role="img" aria-label="Object released into a water tank"><defs><linearGradient id="water" x2="0" y2="1"><stop stop-color="#58d5e2" stop-opacity=".23"/><stop offset="1" stop-color="#168fb6" stop-opacity=".65"/></linearGradient></defs><path d="M100 115V435Q100 453 118 453H622Q640 453 640 435V115" fill="#092b38" stroke="#82bacb" stroke-width="5"/><path d="M104 240Q170 232 240 240T380 240T520 240T636 240V435Q636 449 620 449H120Q104 449 104 435Z" fill="url(#water)"/><path d="M104 240Q170 232 240 240T380 240T520 240T636 240" fill="none" stroke="#8ce9ed" stroke-width="3"/><line x1="105" y1="240" x2="635" y2="240" stroke="#c0ffff44" stroke-dasharray="6 6"/><g id="specimen"></g><text x="122" y="424" fill="#a8e2eb" font-size="20">WATER</text><text id="tankResult" x="370" y="488" fill="#7ce8ca" text-anchor="middle" font-size="25"></text></svg><span class="simnote">Predict first. Then release the specimen.</span></div><aside class="panel stack"><h3>Field notebook</h3><div class="metric"><span>Mass</span><strong id="mass"></strong></div><div class="metric"><span>Volume</span><strong id="vol"></strong></div><div class="formula">ρ = mass ÷ volume</div><label class="hint" for="rho">Your density</label><div class="entry" style="margin:0"><input id="rho" type="number" min="0" step=".01" inputmode="decimal" aria-label="Calculated density"><span class="unit">g/cm³</span></div><div class="twocol prediction"><button data-value="float">↑ Float</button><button data-value="sink">↓ Sink</button></div><button id="release" class="primary fill">Release specimen ↓</button></aside>';
 document.querySelectorAll('[data-object]').forEach(b=>b.onclick=()=>{s.index=+b.dataset.object;document.querySelectorAll('[data-object]').forEach(x=>x.classList.toggle('chosen',x===b));s.predict='';s.tested=false;document.querySelectorAll('.prediction button').forEach(x=>x.classList.remove('chosen'));$('#rho').value='';$('#release').textContent='Release specimen ↓';$('#tankResult').textContent='';feedback('Measure. Calculate. Predict.');drawSpecimen()});chooseButtons('.prediction button','predict');$('#release').onclick=release;drawSpecimen();
}

function renderParticles(){cancelAnimationFrame(raf);const config={solid:{base:-30,c:2.1},liquid:{base:s.base,c:4.2},gas:{base:120,c:2}};s.cfg=config[s.phase];s.qa=0;s.qb=0;s.pred='';s.na=rand([50,75,100]);s.nb=s.na*2;s.pulse=s.na*s.cfg.c*5;ws.innerHTML='<aside class="panel stack"><h3>Particle chamber</h3><div class="phaseTabs">'+['solid','liquid','gas'].map(p=>'<button data-phase="'+p+'" class="'+(s.phase===p?'chosen':'')+'">'+p[0].toUpperCase()+p.slice(1)+'</button>').join('')+'</div><div class="metric"><span>Sample A</span><strong>'+s.na+' g</strong></div><div class="metric"><span>Sample B</span><strong>'+s.nb+' g</strong></div><p class="hint">Same substance. B has twice the mass.</p><div class="formula">Pulse: <b>'+num(s.pulse)+' J</b></div><button id="heatBoth" class="primary">🔥 Heat both</button><button id="coolBoth">❄ Cool both</button><p class="hint">Q: heat transferred · T: temperature</p></aside><div class="sim"><canvas id="particles" width="760" height="500" aria-label="Moving particles in two chambers"></canvas><span class="simlabel">Water · '+s.phase+' state · enlarged model</span><div class="tempCards"><div><small>SAMPLE A · '+s.na+' g</small><strong id="ta"></strong><small id="qa"></small></div><div><small>SAMPLE B · '+s.nb+' g</small><strong id="tb"></strong><small id="qb"></small></div></div><div class="heatControls"><div class="row"><button id="heatA">A + heat</button><button id="coolA">A − heat</button></div><div class="row"><button id="heatB">B + heat</button><button id="coolB">B − heat</button></div></div><span class="simnote">Solid: vibrate · Liquid: slide · Gas: move freely</span></div><aside class="panel stack"><h3>Predict & investigate</h3><p class="hint">Give both samples the same heat. Which temperature changes more?</p><div class="stack prediction"><button data-value="a">A · smaller sample</button><button data-value="b">B · larger sample</button><button data-value="same">Same change</button></div><button id="compare" class="primary fill"> function startParticles(){const c=$('#particles'),ctx=c.getContext('2d');let t=0;const dots=[[],[]];for(let box=0;box<2;box++){let n=box?48:24;for(let i=0;i<n;i++)dots[box].push({x:Math.random()*270+35+box*380,y:Math.random()*210+170,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,seed:Math.random()*6.28})}last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;t+=dt;ctx.clearRect(0,0,760,500);for(let box=0;box<2;box++){let left=25+box*380,right=355+box*380;ctx.fillStyle='#08232ecc';ctx.strokeStyle='#567f8e';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(left,150,330,244,16);ctx.fill();ctx.stroke();let temp=box?s.tb:s.ta;let speed=Math.sqrt((temp+273.15)/(s.cfg.base+273.15));dots[box].forEach((p,i)=>{let x,y;if(s.phase==='solid'){let cols=box?8:6;x=left+35+(i%cols)*34+Math.sin(t*9*speed+p.seed)*3*speed;y=370-Math.floor(i/cols)*31+Math.cos(t*8*speed+p.seed)*3*speed}else{let miny=s.phase==='liquid'?(box?245:305):164; p.x+=p.vx*speed*dt*(s.phase==='gas'?2:1);p.y+=p.vy*speed*dt*(s.phase==='gas'?2:1);if(p.x<left+12||p.x>right-12){p.vx*=-1;p.x=Math.max(left+12,Math.min(right-12,p.x))}if(p.y<miny||p.y>382){p.vy*=-1;p.y=Math.max(miny,Math.min(382,p.y))}x=p.x;y=p.y}ctx.beginPath();ctx.fillStyle=box?'#ffcc76':'#7ce8ca';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=7;ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});}raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}
