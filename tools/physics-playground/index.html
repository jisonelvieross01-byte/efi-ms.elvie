<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics 7: Physics Playground – Gamified Experiments</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1728;color:#172d47;font-family:Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;font-weight:700;min-height:48px;padding:12px 18px;color:inherit;background:#eaf0f7}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #eaa22b;outline-offset:3px}#app{position:fixed;width:1600px;height:900px;transform-origin:top left;background:#f2f6fb;padding:26px 32px;display:grid;grid-template-rows:72px 70px 1fr 76px;gap:16px}header{display:flex;align-items:center;gap:20px}.brand{width:55px;height:55px;background:#173e68;color:#fff;border-radius:18px;display:grid;place-items:center;font-size:25px;font-weight:900}h1{font-size:29px;margin:0}small{font-size:16px;color:#60748a}header .space{flex:1}.team{background:#fff;border:1px solid #dbe4ee;padding:8px 14px;border-radius:14px;font-size:18px}.team input{width:125px;border:0;font-weight:bold;color:#164e74;background:transparent}.timer{display:flex;align-items:center;gap:9px;background:#172f50;color:white;padding:6px 12px;border-radius:14px}.timer button{background:#2c476a;color:#fff;padding:6px 12px}.timer select{border:0;background:transparent;color:inherit;font-size:17px}.timer option{color:#172d47}#clock{font-size:30px;font-variant-numeric:tabular-nums}nav{display:flex;gap:12px}nav button{flex:1;text-align:left;background:#e4ebf4;font-size:22px;display:flex;align-items:center;gap:14px}nav button.active{background:#173e68;color:white}nav b{font-size:30px}nav span{flex:1}nav small{color:inherit;font-size:16px}main{min-height:0;display:grid;grid-template-columns:1fr 380px;gap:18px}.lab{min-height:0;background:white;border:1px solid #dce6ef;border-radius:24px;overflow:hidden;display:flex;flex-direction:column}.labhead{padding:18px 24px 12px;display:flex;align-items:center;gap:16px}.eyebrow{font-size:14px;letter-spacing:2px;font-weight:bold;color:#31816e}h2{margin:4px 0 0;font-size:28px}.dots{margin-left:auto;display:flex;gap:8px}.dot{width:12px;height:12px;border-radius:50%;background:#d5dfeb}.dot.done{background:#169982}.dot.current{box-shadow:0 0 0 4px #f4c666;background:#173e68}#scene{width:100%;flex:1;min-height:0;touch-action:none;user-select:none}.scenehint{text-align:center;padding:10px;background:#edf7f5;color:#27695f;font-size:19px}aside{min-height:0;display:flex;flex-direction:column;gap:12px}.card{padding:14px 18px;border-radius:20px;background:white;border:1px solid #dce6ef}.mission{background:#fff5dc;border-color:#f5dca5}h3{font-size:18px;margin:0 0 10px}#question{font-size:21px;line-height:1.3;margin:0}#controls{flex:1;min-height:0;padding:12px 18px;display:flex;flex-direction:column;justify-content:space-around;gap:3px}.control{display:grid;grid-template-columns:1fr auto;gap:2px;font-size:18px}.control output{font-weight:bold;color:#137965}.control input[type=range]{grid-column:1/-1;width:100%;height:22px;accent-color:#159e86;cursor:pointer}.control input[type=number]{width:120px;padding:5px;border:1px solid #b9c9d9;border-radius:9px}.formula{background:#edf3fa;border-radius:10px;padding:7px;text-align:center;font-size:20px;font-weight:bold}.roles{font-size:17px;display:flex;justify-content:space-between;color:#49627c;padding:4px 3px}.roles b{display:block;font-size:22px;color:#173e68}#feedback{font-size:19px;line-height:1.25;min-height:65px;background:#e7f4f0;color:#215f55}footer{display:flex;align-items:center;gap:10px}footer button{font-size:17px;padding:17px 19px}#predict{background:#efb943}#test{background:#119c84;color:#fff;min-width:142px}#next{background:#173e68;color:#fff;margin-left:auto}#progress{width:122px;font-size:16px;color:#60748a}progress{width:110px;height:10px;accent-color:#119c84}dialog{border:0;border-radius:24px;padding:32px;max-width:720px;color:#172d47;box-shadow:0 30px 100px #0017}dialog::backdrop{background:#091b35ad}dialog h2{margin-bottom:16px}dialog p{font-size:25px;line-height:1.45}dialog button{font-size:20px}.badge{font-size:17px;fill:#60748a}svg text{font-family:Arial,sans-serif}#predictionText{width:100%;height:90px;font:22px Arial;padding:12px;border:2px solid #cbd8e6;border-radius:12px;margin-bottom:16px}#hoverRead{font-size:17px}#fullscreen{font-size:22px;padding:10px} .pulse{animation:pulse .5s}@keyframes pulse{50%{transform:scale(1.04)}}
</style></head><body><div id="app"><header><div class="brand">P7</div><div><small>ELVIE LEARNING LAB · CAMBRIDGE GRADE 7</small><h1>Physics Playground <small>– Gamified Experiments</small></h1></div><div class="space"></div><label class="team">ON DECK <input id="team" aria-label="Team on deck" value="Team 1" maxlength="18"></label><div class="timer"><select id="duration" aria-label="Lesson duration"><option value="50">50 min</option><option value="55" selected>55 min</option><option value="60">60 min</option></select><b id="clock">55:00</b><button id="pause">▶ Start</button></div><button id="fullscreen" aria-label="Fullscreen">⛶</button></header>
<nav><button data-station="0"><b>↔</b><span>Force Tug-of-War</span><small>01</small></button><button data-station="1"><b>⚑</b><span>Speedway Race</span><small>02</small></button><button data-station="2"><b>⚖</b><span>Seesaw Balance</span><small>03</small></button></nav>
<main><section class="lab"><div class="labhead"><div><div class="eyebrow" id="challengeLabel"></div><h2 id="title"></h2></div><div class="dots" id="dots"></div></div><svg id="scene" viewBox="0 0 1080 450" role="img" aria-label="Interactive physics experiment"></svg><div class="scenehint" id="hint"></div></section><aside><div class="card mission"><h3>🔮 PREDICT FIRST</h3><p id="question"></p></div><div class="card" id="controls"></div><div class="card" id="feedback" aria-live="polite"></div><div class="roles"><span><b>☝ Operate</b>Move & test</span><span><b>✎ Calculate</b>Work it out</span><span><b>☏ Explain</b>Use evidence</span></div></aside></main>
<footer><div id="progress"><span id="count"></span><progress max="15" value="0" id="bar"></progress></div><button id="predict">PREDICT</button><button id="test" disabled>▶ TEST</button><button id="reset">↺ RESET EXPERIMENT</button><button id="explain" disabled>SHOW EXPLANATION</button><button id="next" disabled>NEXT CHALLENGE →</button></footer></div>
<dialog id="prediction"><h2>🔮 Make your prediction</h2><p id="predictQ"></p><textarea id="predictionText" placeholder="Say it aloud, sketch on the board, or type here…" aria-label="Your prediction"></textarea><button id="commit">Prediction made →</button><button id="cancel">Keep exploring</button></dialog><dialog id="explanation"><h2 id="explainTitle">What happened?</h2><p id="explainText"></p><button id="closeExplain">Back to the lab</button></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),svg=$('scene'),NS='http://www.w3.org/2000/svg';
const challenges=[
[{title:'A fair tug',q:'Equal pulls. What happens when we release a stationary cart?',v:[100,100,0],hint:'Drag the arrow tips. Longer arrow = stronger force.'},{title:'Break the balance',q:'Make the right pull stronger. Which way will the cart accelerate?',v:[100,200,0]},{title:'Reverse the result',q:'Create a 150 N resultant to the left. Predict the motion.',v:[200,100,0]},{title:'Moving, yet balanced',q:'The cart starts moving right. With equal forces, will it stop?',v:[150,150,3]},{title:'Braking without friction',q:'A cart moves right. Set a leftward resultant. Can its direction change?',v:[200,50,3]}],
[{title:'Find your pace',q:'Runner A travels 20 m in 5 s. Predict the speed, then race.',v:[20,5,20,8],mode:'normal'},{title:'Same track, new time',q:'Keep both distances equal. Make A twice as fast as B.',v:[30,6,30,10],mode:'normal'},{title:'A surprising tie',q:'Can different distances and times produce the same speed?',v:[40,8,30,5],mode:'normal'},{title:'Read the gradient',q:'Make A’s line steeper. What does a steeper gradient mean?',v:[30,6,40,8],mode:'normal'},{title:'Stop, then go',q:'A pauses for 2 s halfway. Predict the graph shape and average speed.',v:[40,10,40,10],mode:'stop'}],
[{title:'Level the beam',q:'Equal forces: where should you place them to balance?',v:[100,2,100,1]},{title:'Small force, big moment',q:'Can a smaller force balance a larger force? Move the loads.',v:[200,1,100,1]},{title:'Find the missing force',q:'Left: 150 N at 2 m. Right: 1 m. What force balances it?',v:[150,2,100,1]},{title:'Closer to the pivot',q:'Balance the beam, then halve one distance. What must change?',v:[200,2,200,2]},{title:'Final challenge',q:'300 N at 2 m. Where must a 400 N load go on the opposite side?',v:[300,2,400,1]}]
];
let station=0,index=0,values=[],predicted=false,tested=false,anim=0,start=0,elapsed=0,running=false,lessonRunning=false,remaining=3300,lastTick=0;const completed=new Set();let audio;
function tone(f=520){try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.frequency.value=f;o.start();o.stop(audio.currentTime+.18)}catch(e){}}
document.addEventListener('pointerdown',()=>tone(240),{once:true});
function resize(){let s=Math.min(innerWidth/1600,innerHeight/900);$('app').style.transform=`scale(${s})`;$('app').style.left=(innerWidth-1600*s)/2+'px';$('app').style.top=(innerHeight-900*s)/2+'px'}addEventListener('resize',resize);resize();
const fmt=n=>Number(n.toFixed(2));
function current(){return challenges[station][index]}
function load(){cancelAnimationFrame(anim);running=false;values=[...current().v];predicted=false;tested=false;elapsed=0;$('title').textContent=current().title;$('question').textContent=current().q;$('challengeLabel').textContent=`STATION ${station+1} / 03 · EXPERIMENT ${index+1} / 05 · EXPLORE + EXPLAIN ~3 MIN`;$('dots').innerHTML=challenges[station].map((_,i)=>`<span class="dot ${completed.has(station+'-'+i)?'done':''} ${i===index?'current':''}"></span>`).join('');document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===station));$('feedback').textContent='Explore → predict → test → explain.';$('hint').textContent=station===0?'Drag the force arrow tips • Frictionless track':station===1?'Adjust the runners • Touch the graph to read time and distance':'Drag the loads along the beam • Distances measured when level';$('predict').textContent='PREDICT';buttons();controls();draw();$('count').textContent=completed.size+' / 15 tested';$('bar').value=completed.size}
function buttons(){$('test').disabled=!predicted||running;$('explain').disabled=!tested||running;$('next').disabled=!tested||running;$('predict').disabled=running;$('reset').disabled=false;document.querySelectorAll('#controls input').forEach(i=>i.disabled=running||(station===2&&index===4&&i.dataset.i!=='3'))}
function control(label,i,min,max,step,unit,locked=false){return `<label class="control">${label}<output id="out${i}">${values[i]} ${unit}</output><input aria-label="${label}" type="range" data-i="${i}" min="${min}" max="${max}" step="${step}" value="${values[i]}" ${locked?'disabled':''}></label>`}
function controls(){let html='';if(station===0){html='<div class="formula">Resultant = right − left</div>'+control('← Left pull',0,0,400,10,'N')+control('Right pull →',1,0,400,10,'N')+`<div class="formula">Start: ${values[2]?'3 m/s →':'at rest'} · mass 50 kg</div>`}else if(station===1){html='<div class="formula">Speed = distance ÷ time</div>'+control('A · distance',0,10,60,5,'m')+control('A · total time',1,4,20,1,'s')+control('B · distance',2,10,60,5,'m')+control('B · total time',3,4,20,1,'s')+`<label class="control">Calculate A’s speed<input id="answer" type="number" min="0" step="0.1" placeholder="? m/s" aria-label="Calculated average speed of A"></label>`}else{let fixed=index===4;html='<div class="formula">Moment = force × distance</div>'+control('Left force',0,50,400,50,'N',fixed)+control('Left distance',1,.5,4,.25,'m',fixed)+control('Right force',2,50,400,50,'N',fixed)+control('Right distance',3,.5,4,.25,'m')}
$('controls').innerHTML=html;document.querySelectorAll('[data-i]').forEach(i=>i.oninput=()=>change(+i.dataset.i,+i.value));}
function change(i,v){if(running)return;values[i]=v;elapsed=0;predicted=false;tested=false;$('predict').textContent='PREDICT';$('feedback').textContent='Settings changed. Make a fresh prediction.';if($('out'+i))$('out'+i).textContent=v+(station===0?' N':station===1?(i%2?' s':' m'):(i%2?' m':' N'));buttons();draw()}
function el(tag,attrs={},text=''){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));n.textContent=text;return n}
function add(tag,a,t,parent=svg){let n=el(tag,a,t);parent.append(n);return n}function txt(x,y,t,size=23,fill='#173e68',parent=svg){return add('text',{x,y,'font-size':size,fill,'text-anchor':'middle','font-weight':700},t,parent)}
function line(x1,y1,x2,y2,color='#b9cadc',width=2,parent=svg){return add('line',{x1,y1,x2,y2,stroke:color,'stroke-width':width,'stroke-linecap':'round'},'',parent)}
function drag(node,fn){node.style.cursor='grab';node.onpointerdown=e=>{if(running)return;e.preventDefault();svg.setPointerCapture(e.pointerId);svg.onpointermove=ev=>{let p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;let a=p.matrixTransform(svg.getScreenCTM().inverse());fn(a.x,a.y);draw()};svg.onpointerup=()=>{svg.onpointermove=null;controls();buttons();draw()}}}

function cart(x,y){let g=add('g',{transform:`translate(${x} ${y})`});add('rect',{x:-51,y:-47,width:102,height:60,rx:13,fill:'#f4b942'},'',g);txt(0,-9,'50 kg',21,'#634216',g);[-33,33].forEach(a=>{add('circle',{cx:a,cy:21,r:15,fill:'#173e68'},'',g);add('circle',{cx:a,cy:21,r:5,fill:'#fff'},'',g)});return g}
function arrow(x,y,len,color,left,i){let end=x+(left?-len:len);line(x,y,end,y,color,15);add('path',{d:`M${end+(left?19:-19)} ${y-17} L${end} ${y} L${end+(left?19:-19)} ${y+17}`,fill:'none',stroke:color,'stroke-width':9,'stroke-linejoin':'round'});txt((x+end)/2,y-32,values[i]+' N',27,color);let h=add('circle',{cx:end,cy:y,r:28,fill:color,opacity:.16,role:'slider','aria-label':left?'Drag left force':'Drag right force'});drag(h,px=>{let v=Math.max(0,Math.min(400,Math.round(Math.max(0,(left?x-px:px-x)-30)/.65/10)*10));values[i]=v;predicted=false;tested=false;$('feedback').textContent='Release arrow, then predict.';$('out'+i).textContent=v+' N';$('predict').textContent='PREDICT';buttons()});}
function distanceA(t){let [d,total]=values;if(current().mode!=='stop')return d*Math.min(t/total,1);let move=(total-2)/2;return t<=move?d/2*t/move:t<=move+2?d/2:Math.min(d,d/2+d/2*(t-move-2)/move)}
function runner(x,y,color,label,t){let g=add('g',{transform:`translate(${x} ${y})`});let swing=running?Math.sin(t*12)*14:8;add('circle',{cx:0,cy:-37,r:10,fill:color},'',g);line(0,-25,0,0,color,7,g);line(0,0,-16+swing,22,color,7,g);line(0,0,16-swing,22,color,7,g);line(0,-20,-20,-5+swing/2,color,6,g);line(0,-20,20,-20-swing/2,color,6,g);txt(-30,-30,label,20,color,g)}
function draw(){svg.innerHTML='';add('rect',{x:0,y:0,width:1080,height:450,fill:'#fbfdff'});if(station===0){for(let x=20;x<1080;x+=40)line(x,330,x+20,350,'#e2e9f1');line(20,330,1060,330,'#8ea5bd',5);let net=values[1]-values[0],x=540+(values[2]*elapsed+.5*net/50*elapsed*elapsed)*8;cart(x,295);arrow(x-65,260,30+values[0]*.65,'#dc7464',true,0);arrow(x+65,260,30+values[1]*.65,'#229f90',false,1);txt(540,65,tested?`Resultant: ${Math.abs(net)} N ${net>0?'→':net<0?'←':'· balanced'}`:'Two pulls. One prediction.',30);txt(540,115,tested?`Velocity: ${fmt(values[2]+net/50*elapsed)} m/s (right is +)`:'At rest or moving? Check the starting motion.',22,'#60748a');txt(540,415,tested?`t = ${fmt(elapsed)} s · a = ${fmt(net/50)} m/s²`:'Touch + drag an arrow tip to change its force.',21,'#60748a')}
else if(station===1){let maxD=60,maxT=20;txt(285,28,'THE TRACK',16,'#60748a');[115,225].forEach((y,i)=>{add('rect',{x:65,y:y-38,width:470,height:78,rx:15,fill:i?'#e5f2fb':'#fff1db'});line(80,y+28,520,y+28,'#c2d5e3',2);[0,20,40,60].forEach(d=>{line(85+d/60*420,y+28,85+d/60*420,y+35);txt(85+d/60*420,y+55,d+' m',15,'#60748a')});let d=i?values[2]*Math.min(elapsed/values[3],1):distanceA(elapsed);runner(85+d/60*420,y,i?'#3d8acb':'#dc9a24',i?'B':'A',elapsed);let goal=85+values[i?2:0]/60*420;line(goal,y-35,goal,y+28,i?'#3d8acb':'#dc9a24',2);});txt(280,350,tested?`A ${fmt(values[0]/values[1])} m/s  •  B ${fmt(values[2]/values[3])} m/s`:'Calculate first. Compare speeds.',22);txt(280,390,current().mode==='stop'?'A rests for 2 seconds halfway.':'Each runner stops at their chosen distance.',19,'#60748a');let gx=640,gy=350,gw=370,gh=280;txt(820,28,'DISTANCE–TIME GRAPH',16,'#60748a');for(let t=0;t<=20;t+=5){let x=gx+t/maxT*gw;line(x,gy,x,gy-gh,'#e2eaf2');txt(x,gy+27,t,16)}for(let d=0;d<=60;d+=10){let y=gy-d/maxD*gh;line(gx,y,gx+gw,y,'#e2eaf2');txt(gx-25,y+5,d,16)}line(gx,gy,gx+gw,gy,'#173e68',3);line(gx,gy,gx,gy-gh,'#173e68',3);txt(825,gy+55,'Time (s)',18);txt(820,52,'Distance (m)',17);if(tested){[0,1].forEach(i=>{let pts=[];for(let t=0;t<=Math.min(elapsed,20)+.001;t+=.05){let d=i?values[2]*Math.min(t/values[3],1):distanceA(t);pts.push(`${gx+t/maxT*gw},${gy-d/maxD*gh}`)}add('polyline',{points:pts.join(' '),fill:'none',stroke:i?'#3d8acb':'#dc9a24','stroke-width':5});});}let hit=add('rect',{x:gx,y:gy-gh,width:gw,height:gh,fill:'transparent',role:'button','aria-label':'Touch graph to read coordinates'});hit.onpointerdown=e=>{let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform(svg.getScreenCTM().inverse());$('feedback').textContent=`Graph cursor: ${fmt((p.x-gx)/gw*20)} s, ${fmt((gy-p.y)/gh*60)} m. Gradient = change in distance ÷ change in time.`};}
else{let [lf,ld,rf,rd]=values;let diff=rf*rd-lf*ld;let target=Math.abs(diff)<.01?0:Math.sign(diff)*Math.min(.23,Math.abs(diff)/1600);let angle=tested?target*(1-Math.exp(-elapsed*2.5)*Math.cos(elapsed*4)):0;txt(540,45,tested?(Math.abs(diff)<.01?'BALANCED! Equal moments.':diff>0?'Clockwise moment wins ↻':'Anticlockwise moment wins ↺'):'Move the loads. Find the balance.',28);add('path',{d:'M540 258 L480 373 L600 373 Z',fill:'#b7c9dc'});add('circle',{cx:540,cy:258,r:13,fill:'#173e68'});line(100,375,980,375,'#dae5ef',5);let beam=add('g',{transform:`translate(540 258) rotate(${angle*180/Math.PI})`});add('rect',{x:-435,y:-9,width:870,height:18,rx:9,fill:'#173e68'},'',beam);for(let d=-4;d<=4;d+=.5){line(d*100,-9,d*100,d%1?0:10,'#fff',2,beam);if(d%1===0&&d!==0)txt(d*100,40,Math.abs(d)+' m',17,'#60748a',beam)}[[lf,-ld,0,1,'#dc7464'],[rf,rd,2,3,'#229f90']].forEach(([f,d,fi,di,c])=>{let x=d*100,g=add('g',{},'',beam);add('rect',{x:x-38,y:-82,width:76,height:73,rx:12,fill:c},'',g);txt(x,-44,f+' N',20,'white',g);line(x,-9,x,10,c,5,beam);g.setAttribute('role','slider');g.setAttribute('aria-label',di===1?'Left load position':'Right load position');if(!(index===4&&di===1))drag(g,px=>{let dd=Math.max(.5,Math.min(4,Math.round((di===1?540-px:px-540)/100*4)/4));values[di]=dd;predicted=false;tested=false;g.setAttribute('transform',`translate(${((di===1?-dd:dd)-d)*100} 0)`);$('out'+di).textContent=dd+' m';$('feedback').textContent='Release the load, then predict.'})});txt(540,409,tested?`Left: ${fmt(lf*ld)} N m  ↶     |     ↷  Right: ${fmt(rf*rd)} N m`:'Ideal light beam • Vertical loads • Pivot at the centre',22,'#60748a');}}
function result(){if(station===0){let n=values[1]-values[0];return n===0?(values[2]?'Balanced forces: the moving cart keeps a constant velocity.':'Balanced forces: the cart stays at rest.'):`Resultant ${Math.abs(n)} N ${n<0?'left':'right'}. Acceleration is in that direction.`}if(station===1){let s=values[0]/values[1],b=values[2]/values[3],answer=$('answer').value;return `A: ${fmt(s)} m/s · B: ${fmt(b)} m/s. ${Math.abs(s-b)<.001?'Equal average speeds.':s>b?'A has greater average speed.':'B has greater average speed.'}${answer!==''?(Math.abs(+answer-s)<.06?' Your calculation agrees!':' Recheck distance ÷ total time.') :''}`}let l=values[0]*values[1],r=values[2]*values[3];return Math.abs(l-r)<.01?'Balanced! Equal opposing moments. Explain your evidence.':`${l>r?'Left':'Right'} side falls. Try making the two moments equal.`}
function explain(){if(station===0){let n=values[1]-values[0];return `${values[1]} − ${values[0]} = ${n} N (right is positive). ${result()} ${index===4?'An opposing force slows the cart, then reverses it if it keeps acting.':''} This frictionless 50 kg cart has acceleration ${fmt(n/50)} m/s². Vertical forces cancel.`}if(station===1)return `A: ${values[0]} ÷ ${values[1]} = ${fmt(values[0]/values[1])} m/s. B: ${values[2]} ÷ ${values[3]} = ${fmt(values[2]/values[3])} m/s. A steeper distance–time line means greater speed. A horizontal segment means stopped. ${current().mode==='stop'?`A’s 2 s pause counts in total time; moving speed is ${fmt(values[0]/(values[1]-2))} m/s.`:'A straight rising line means constant speed.'} Runners stop at their own finish marks; compare gradients to compare speed.`;return index===4?`300 × 2 = 600 N m. For balance, 400 × d = 600, so d = 1.5 m on the opposite side. The forces need not be equal; their moments must be equal.`:`Left: ${values[0]} × ${values[1]} = ${fmt(values[0]*values[1])} N m. Right: ${values[2]} × ${values[3]} = ${fmt(values[2]*values[3])} N m. Equal opposing moments balance the beam. Distance is perpendicular to the force’s line of action; on this level beam it is the distance to the pivot. The animation shows a damped tilt, not a timed measurement.`}
$('predict').onclick=()=>{$('predictQ').textContent=current().q;$('predictionText').value='';$('prediction').showModal()};$('cancel').onclick=()=>$('prediction').close();$('commit').onclick=()=>{predicted=true;$('prediction').close();$('feedback').textContent='Prediction recorded. Test it and compare the evidence.';$('predict').textContent='✓ PREDICTED';buttons();tone(650)};
$('test').onclick=()=>{tested=true;running=true;elapsed=0;start=performance.now();$('feedback').textContent='Observe closely…';buttons();tone(740);let duration=station===1?Math.max(values[1],values[3]):station===0?2:2.5;function frame(now){elapsed=Math.min(duration,(now-start)/1000*(station===1?3:1));draw();if(elapsed<duration)anim=requestAnimationFrame(frame);else{running=false;completed.add(station+'-'+index);$('feedback').textContent=result();$('count').textContent=completed.size+' / 15 tested';$('bar').value=completed.size;buttons();if(station===2&&index===4){document.querySelectorAll('#controls input').forEach((a,i)=>a.disabled=i<3)}tone(880)}}anim=requestAnimationFrame(frame)};
$('reset').onclick=load;$('explain').onclick=()=>{$('explainText').textContent=explain();$('explainTitle').textContent='Observe → explain → try again';$('explanation').showModal()};$('closeExplain').onclick=()=>$('explanation').close();$('next').onclick=()=>{if(index<4)index++;else if(station<2){station++;index=0}else{$('explainTitle').textContent='🎉 Playground complete!';$('explainText').textContent='One final explanation: why does 400 N at 1.5 m balance 300 N at 2 m? Both moments are 600 N m. Share one discovery from each station.';$('explanation').showModal();return}load()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{station=+b.dataset.station;index=0;load()});$('pause').onclick=()=>{lessonRunning=!lessonRunning;lastTick=performance.now();$('pause').textContent=lessonRunning?'Ⅱ Pause':'▶ Start';tone()};$('duration').onchange=()=>{remaining=+$('duration').value*60;updateClock()};function updateClock(){$('clock').textContent=String(Math.floor(Math.ceil(remaining)/60)).padStart(2,'0')+':'+String(Math.ceil(remaining)%60).padStart(2,'0')}setInterval(()=>{if(lessonRunning){let now=performance.now();remaining=Math.max(0,remaining-(now-lastTick)/1000);lastTick=now;if(remaining===0){lessonRunning=false;$('pause').textContent='▶ Start';tone(440);$('feedback').textContent='Time! Finish your explanation and share your discoveries.'}updateClock()}},200);$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};load();
</script></body></html>
