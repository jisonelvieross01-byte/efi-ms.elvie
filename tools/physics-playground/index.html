</style></head><body><div id="app" data-station="0"><header><div class="brand">P7</div><div><small>ELVIE LEARNING LAB · CAMBRIDGE GRADE 7</small><h1>Physics Playground <small>– Gamified Experiments</small></h1></div><div class="space"></div><label class="team">ON DECK <input id="team" aria-label="Team on deck" value="Team 1" maxlength="18"></label><div class="timer"><select id="duration" aria-label="Lesson duration"><option value="50">50 min</option><option value="55" selected>55 min</option><option value="60">60 min</option></select><b id="clock">55:00</b><button id="pause">▶ Start</button></div><button id="fullscreen" aria-label="Fullscreen">⛶</button></header>

<script>
'use strict';
const $=id=>document.getElementById(id),svg=$('scene'),NS='http://www.w3.org/2000/svg';
const challenges=[
[{title:'A fair tug',q:'Equal pulls. What happens when we release a stationary cart?',v:[100,100,0],hint:'Drag the arrow tips. Longer arrow = stronger force.'},{title:'Break the balance',q:'Make the right pull stronger. Which way will the cart accelerate?',v:[100,200,0]},{title:'Reverse the result',q:'Create a 150 N resultant to the left. Predict the motion.',v:[200,100,0]},{title:'Moving, yet balanced',q:'The cart starts moving right. With equal forces, will it stop?',v:[150,150,3]},{title:'Braking without friction',q:'A cart moves right. Set a leftward resultant. Can its direction change?',v:[200,50,3]}],
[{title:'Find your pace',q:'Runner A travels 20 m in 5 s. Predict the speed, then race.',v:[20,5,20,8],mode:'normal'},{title:'Same track, new time',q:'Keep both distances equal. Make A twice as fast as B.',v:[30,6,30,10],mode:'normal'},{title:'A surprising tie',q:'Can different distances and times produce the same speed?',v:[40,8,30,5],mode:'normal'},{title:'Read the gradient',q:'Make A’s line steeper. What does a steeper gradient mean?',v:[30,6,40,8],mode:'normal'},{title:'Stop, then go',q:'A pauses for 2 s halfway. Predict the graph shape and average speed.',v:[40,10,40,10],mode:'stop'}],
[{title:'Level the beam',q:'Equal forces: where should you place them to balance?',v:[100,2,100,1]},{title:'Small force, big moment',q:'Can a smaller force balance a larger force? Move the loads.',v:[200,1,100,1]},{title:'Find the missing force',q:'Left: 150 N at 2 m. Right: 1 m. What force balances it?',v:[150,2,100,1]},{title:'Closer to the pivot',q:'Balance the beam, then halve one distance. What must change?',v:[200,2,200,2]},{title:'Final challenge',q:'300 N at 2 m. Where must a 400 N load go on the opposite side?',v:[300,2,400,1]}]
];
let station=0,index=0,values=[],predicted=false,tested=false,anim=0,start=0,elapsed=0,running=false,lessonRunning=false,remaining=3300,lastTick=0;const completed=new Set();let audio;
function tone(f=520){try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.frequency.value=f;o.start();o.stop(audio.currentTime+.18)}catch(e){}}
document.addEventListener('pointerdown',()=>tone(240),{once:true});
function resize(){let s=Math.min(innerWidth/1600,innerHeight/900);$('app').style.transform=`scale(${s})`;$('app').style.left=(innerWidth-1600*s)/2+'px';$('app').style.top=(innerHeight-900*s)/2+'px'}addEventListener('resize',resize);resize();
const fmt=n=>Number(n.toFixed(2));
function current(){return challenges[station][index]}
function load(){$('app').dataset.station=station;document.querySelector('.lab').classList.remove('testing');svg.classList.remove('scene-entry');void svg.getBoundingClientRect();svg.classList.add('scene-entry');cancelAnimationFrame(anim);running=false;values=[...current().v];predicted=false;tested=false;elapsed=0;$('title').textContent=current().title;$('question').textContent=current().q;$('challengeLabel').textContent=`STATION ${station+1} / 03 · EXPERIMENT ${index+1} / 05 · ~3 MIN`;$('dots').innerHTML=challenges[station].map((_,i)=>`<button class="dot ${completed.has(station+'-'+i)?'done':''} ${i===index?'current':''}" data-challenge="${i}" aria-label="Open experiment ${i+1}" aria-current="${i===index?'step':'false'}">${completed.has(station+'-'+i)?'✓':i+1}</button>`).join('');document.querySelectorAll('[data-challenge]').forEach(b=>b.onclick=()=>{index=+b.dataset.challenge;load();tone(450+index*90)});document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===station));$('feedback').textContent='Explore → predict → test → explain.';$('hint').textContent=station===0?'Drag the force arrow tips • Frictionless track':station===1?'Adjust the runners • Touch the graph to read time and distance':'Drag the loads along the beam • Distances measured when level';$('predict').textContent='PREDICT';buttons();controls();draw();$('count').textContent=completed.size+' / 15 tested';$('bar').value=completed.size}

function control(label,i,min,max,step,unit,locked=false){return `<label class="control">${label}<button class="readout" data-edit="${i}" id="out${i}" aria-label="Edit ${label}" ${locked?'disabled':''}>${values[i]} ${unit}</button><input aria-label="${label}" type="range" data-i="${i}" min="${min}" max="${max}" step="${step}" value="${values[i]}" ${locked?'disabled':''}></label>`}
function controls(){let html='';if(station===0){html='<div class="formula">Resultant = right − left</div>'+control('← Left pull',0,0,400,10,'N')+control('Right pull →',1,0,400,10,'N')+`<div class="formula">Start: ${values[2]?'3 m/s →':'at rest'} · mass 50 kg</div>`}else if(station===1){html='<div class="formula">Speed = distance ÷ time</div>'+control('A · distance',0,10,60,5,'m')+control('A · total time',1,4,20,1,'s')+control('B · distance',2,10,60,5,'m')+control('B · total time',3,4,20,1,'s')+`<label class="control">Calculate A’s speed<input id="answer" type="number" min="0" step="0.1" placeholder="? m/s" aria-label="Calculated average speed of A"></label>`}else{let fixed=index===4;html='<div class="formula">Moment = force × distance</div>'+control('Left force',0,50,400,50,'N',fixed)+control('Left distance',1,.5,4,.25,'m',fixed)+control('Right force',2,50,400,50,'N',fixed)+control('Right distance',3,.5,4,.25,'m')}
$('controls').innerHTML=html;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editValue(+b.dataset.edit));document.querySelectorAll('[data-i]').forEach(i=>i.oninput=()=>change(+i.dataset.i,+i.value));}
function change(i,v){if(running)return;values[i]=v;elapsed=0;predicted=false;tested=false;$('predict').textContent='PREDICT';$('feedback').textContent='Settings changed. Make a fresh prediction.';if($('out'+i))$('out'+i).textContent=v+(station===0?' N':station===1?(i%2?' s':' m'):(i%2?' m':' N'));buttons();draw()}
function el(tag,attrs={},text=''){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));n.textContent=text;return n}
function add(tag,a,t,parent=svg){let n=el(tag,a,t);parent.append(n);return n}function txt(x,y,t,size=23,fill='#173e68',parent=svg){return add('text',{x,y,'font-size':size,fill,'text-anchor':'middle','font-weight':700},t,parent)}
function line(x1,y1,x2,y2,color='#b9cadc',width=2,parent=svg){return add('line',{x1,y1,x2,y2,stroke:color,'stroke-width':width,'stroke-linecap':'round'},'',parent)}
function drag(node,fn){node.style.cursor='grab';node.onpointerdown=e=>{if(running)return;e.preventDefault();svg.setPointerCapture(e.pointerId);svg.onpointermove=ev=>{let p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;let a=p.matrixTransform(svg.getScreenCTM().inverse());fn(a.x,a.y);draw()};svg.onpointerup=()=>{svg.onpointermove=null;controls();buttons();draw()}}}

function cart(x,y){let g=add('g',{transform:`translate(${x} ${y})`});add('ellipse',{cx:0,cy:34,rx:74,ry:11,fill:'#303754',opacity:.13},'',g);add('rect',{x:-57,y:-47,width:114,height:63,rx:18,fill:'url(#cartPaint)',stroke:'#be7e31','stroke-width':3},'',g);add('rect',{x:-35,y:-93,width:70,height:46,rx:16,fill:'#fff9e9',stroke:'#a66a31','stroke-width':3},'',g);line(0,-93,0,-105,'#a66a31',3,g);add('circle',{cx:0,cy:-110,r:6,fill:'#76debe'},'',g);[-14,14].forEach(a=>{add('circle',{cx:a,cy:-72,r:6,fill:'#343456'},'',g);add('circle',{cx:a+2,cy:-74,r:2,fill:'white'},'',g)});txt(0,-10,'50 kg',22,'#614125',g);[-35,35].forEach(a=>{add('circle',{cx:a,cy:20,r:17,fill:'#333552',stroke:'#727a9a','stroke-width':4},'',g);add('circle',{cx:a,cy:20,r:6,fill:'#f9d789'},'',g)});return g}

function arrow(x,y,len,color,left,i){let end=x+(left?-len:len);line(x,y,end,y,color,15);add('path',{d:`M${end+(left?19:-19)} ${y-17} L${end} ${y} L${end+(left?19:-19)} ${y+17}`,fill:'none',stroke:color,'stroke-width':9,'stroke-linejoin':'round'});txt((x+end)/2,y-32,values[i]+' N',27,color);let h=add('circle',{cx:end,cy:y,r:28,fill:color,opacity:.18,class:'grab-halo',role:'slider','aria-label':left?'Drag left force':'Drag right force'});drag(h,px=>{let v=Math.max(0,Math.min(400,Math.round(Math.max(0,(left?x-px:px-x)-30)/.65/10)*10));values[i]=v;predicted=false;tested=false;$('feedback').textContent='Release arrow, then predict.';$('out'+i).textContent=v+' N';$('predict').textContent='PREDICT';buttons()});}
function distanceA(t){let [d,total]=values;if(current().mode!=='stop')return d*Math.min(t/total,1);let move=(total-2)/2;return t<=move?d/2*t/move:t<=move+2?d/2:Math.min(d,d/2+d/2*(t-move-2)/move)}
function runner(x,y,color,label,t){let g=add('g',{transform:`translate(${x} ${y})`});let moving=running&&(label==='A'?elapsed<values[1]:elapsed<values[3]);if(label==='A'&&current().mode==='stop'){let m=(values[1]-2)/2;if(t>=m&&t<=m+2)moving=false}let swing=moving?Math.sin(t*12)*14:8;add('ellipse',{cx:0,cy:25,rx:25,ry:5,fill:'#293b56',opacity:.15},'',g);add('circle',{cx:0,cy:-40,r:13,fill:'#f1c596'},'',g);add('path',{d:'M-13 -43 Q-10 -62 10 -49 L15 -39 L-3 -43 Z',fill:'#3e3655'},'',g);add('path',{d:'M-3 -46 L15 -43',stroke:color,'stroke-width':5,'stroke-linecap':'round'},'',g);add('rect',{x:-9,y:-25,width:18,height:28,rx:5,fill:color},'',g);txt(0,-8,label,14,'#fff',g);line(-3,2,-16+swing,22,'#3a3556',7,g);line(3,2,16-swing,22,'#3a3556',7,g);line(-16+swing,22,-8+swing,22,color,5,g);line(16-swing,22,24-swing,22,color,5,g);line(-8,-20,-20,-5+swing/2,'#e9b481',6,g);line(8,-20,20,-20-swing/2,'#e9b481',6,g);if(moving){line(-38,-5,-27,-5,color,2,g);line(-43,3,-31,3,color,2,g)}}

function draw(){svg.innerHTML='';stageArt();if(station===0){for(let x=20;x<1080;x+=40)line(x,330,x+20,350,'#e2e9f1');line(20,330,1060,330,'#8ea5bd',5);let net=values[1]-values[0],x=540+(values[2]*elapsed+.5*net/50*elapsed*elapsed)*8;cart(x,295);arrow(x-65,260,30+values[0]*.65,'#dc7464',true,0);arrow(x+65,260,30+values[1]*.65,'#229f90',false,1);txt(540,65,tested?`Resultant: ${Math.abs(net)} N ${net>0?'→':net<0?'←':'· balanced'}`:'Two pulls. One prediction.',30);txt(540,115,tested?`Velocity: ${fmt(values[2]+net/50*elapsed)} m/s (right is +)`:'At rest or moving? Check the starting motion.',22,'#60748a');txt(540,415,tested?`t = ${fmt(elapsed)} s · a = ${fmt(net/50)} m/s²`:'Touch + drag an arrow tip to change its force.',21,'#60748a')}
else if(station===1){let maxD=60,maxT=20;txt(285,28,'THE TRACK',16,'#60748a');[115,225].forEach((y,i)=>{add('rect',{x:65,y:y-38,width:470,height:78,rx:15,fill:i?'#d9f2f8':'#ffeed6',stroke:i?'#9dd7e4':'#efcf9c','stroke-width':2});line(80,y+28,520,y+28,'#c2d5e3',2);[0,20,40,60].forEach(d=>{line(85+d/60*420,y+28,85+d/60*420,y+35);txt(85+d/60*420,y+55,d+' m',15,'#60748a')});let d=i?values[2]*Math.min(elapsed/values[3],1):distanceA(elapsed);runner(85+d/60*420,y,i?'#3d8acb':'#dc9a24',i?'B':'A',elapsed);let goal=85+values[i?2:0]/60*420;finishFlag(goal,y-35);line(goal,y-35,goal,y+28,i?'#3d8acb':'#dc9a24',2);});txt(280,350,tested?`A ${fmt(values[0]/values[1])} m/s  •  B ${fmt(values[2]/values[3])} m/s`:'Calculate first. Compare speeds.',22);txt(280,390,current().mode==='stop'?'A rests for 2 seconds halfway.':'Each runner stops at their chosen distance.',19,'#60748a');let gx=640,gy=350,gw=370,gh=280;txt(820,28,'DISTANCE–TIME GRAPH',16,'#60748a');for(let t=0;t<=20;t+=5){let x=gx+t/maxT*gw;line(x,gy,x,gy-gh,'#e2eaf2');txt(x,gy+27,t,16)}for(let d=0;d<=60;d+=10){let y=gy-d/maxD*gh;line(gx,y,gx+gw,y,'#e2eaf2');txt(gx-25,y+5,d,16)}line(gx,gy,gx+gw,gy,'#173e68',3);line(gx,gy,gx,gy-gh,'#173e68',3);txt(825,gy+55,'Time (s)',18);txt(820,52,'Distance (m)',17);if(tested){[0,1].forEach(i=>{let pts=[];for(let t=0;t<=Math.min(elapsed,20)+.001;t+=.05){let d=i?values[2]*Math.min(t/values[3],1):distanceA(t);pts.push(`${gx+t/maxT*gw},${gy-d/maxD*gh}`)}add('polyline',{points:pts.join(' '),fill:'none',stroke:i?'#3d8acb':'#dc9a24','stroke-width':5});});}let hit=add('rect',{x:gx,y:gy-gh,width:gw,height:gh,fill:'transparent',role:'button','aria-label':'Touch graph to read coordinates'});hit.onpointerdown=e=>{let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform(svg.getScreenCTM().inverse());let t=Math.max(0,Math.min(20,(p.x-gx)/gw*20));let moving=(values[1]-2)/2;let slope=t>=values[1]?0:current().mode==='stop'?(t>=moving&&t<=moving+2?0:values[0]/(values[1]-2)):values[0]/values[1];if(tested){let d=distanceA(t);line(gx,gy,gx+t/20*gw,gy,'#dc9a24',3);line(gx+t/20*gw,gy,gx+t/20*gw,gy-d/60*gh,'#dc9a24',3);$('feedback').textContent=`A at ${fmt(t)} s: ${fmt(d)} m. Segment gradient = ${fmt(slope)} m/s. ${slope===0?'Horizontal = stopped.':'Steeper = faster.'}`}else $('feedback').textContent='Predict and test first. Then touch the graph to inspect A’s distance and segment gradient.'};}
else{let [lf,ld,rf,rd]=values;let diff=rf*rd-lf*ld;let target=Math.abs(diff)<.01?0:Math.sign(diff)*Math.min(.23,Math.abs(diff)/1600);let angle=tested?target*(1-Math.exp(-elapsed*2.5)*Math.cos(elapsed*4)):0;txt(540,45,tested?(Math.abs(diff)<.01?'BALANCED! Equal moments.':diff>0?'Clockwise moment wins ↻':'Anticlockwise moment wins ↺'):'Move the loads. Find the balance.',28);add('path',{d:'M540 258 L480 373 L600 373 Z',fill:'url(#pivotPaint)',stroke:'#8270ad','stroke-width':3});add('circle',{cx:540,cy:258,r:13,fill:'#173e68'});line(100,375,980,375,'#dae5ef',5);let beam=add('g',{transform:`translate(540 258) rotate(${angle*180/Math.PI})`});add('rect',{x:-435,y:-9,width:870,height:18,rx:9,fill:'#655085',stroke:'#45375e','stroke-width':3},'',beam);for(let d=-4;d<=4;d+=.5){line(d*100,-9,d*100,d%1?0:10,'#fff',2,beam);if(d%1===0&&d!==0)txt(d*100,40,Math.abs(d)+' m',17,'#60748a',beam)}[[lf,-ld,0,1,'#dc7464'],[rf,rd,2,3,'#229f90']].forEach(([f,d,fi,di,c])=>{let x=d*100,g=add('g',{},'',beam);add('rect',{x:x-38,y:-82,width:76,height:73,rx:12,fill:c},'',g);add('path',{d:`M${x-17} -82 V-94 Q${x} -109 ${x+17} -94 V-82`,fill:'none',stroke:c,'stroke-width':7},'',g);txt(x,-44,f+' N',20,'white',g);[-12,12].forEach(a=>add('circle',{cx:x+a,cy:-25,r:4,fill:'#ffffffa0'},'',g));line(x,-9,x,10,c,5,beam);g.setAttribute('role','slider');g.setAttribute('aria-label',di===1?'Left load position':'Right load position');if(!(index===4&&di===1))drag(g,px=>{let dd=Math.max(.5,Math.min(4,Math.round((di===1?540-px:px-540)/100*4)/4));values[di]=dd;predicted=false;tested=false;g.setAttribute('transform',`translate(${((di===1?-dd:dd)-d)*100} 0)`);$('out'+di).textContent=dd+' m';$('feedback').textContent='Release the load, then predict.'})});txt(540,409,tested?`Left: ${fmt(lf*ld)} N m  ↶     |     ↷  Right: ${fmt(rf*rd)} N m`:'Ideal light beam • Vertical loads • Pivot at the centre',22,'#60748a');}}
function result(){if(station===0){let n=values[1]-values[0];return n===0?(values[2]?'Balanced forces: the moving cart keeps a constant velocity.':'Balanced forces: the cart stays at rest.'):`Resultant ${Math.abs(n)} N ${n<0?'left':'right'}. Acceleration is in that direction.`}if(station===1){let s=values[0]/values[1],b=values[2]/values[3],answer=$('answer').value;return `A: ${fmt(s)} m/s · B: ${fmt(b)} m/s. ${Math.abs(s-b)<.001?'Equal average speeds.':s>b?'A has greater average speed.':'B has greater average speed.'}${answer!==''?(Math.abs(+answer-s)<.06?' Your calculation agrees!':' Recheck distance ÷ total time.') :''}`}let l=values[0]*values[1],r=values[2]*values[3];return Math.abs(l-r)<.01?'Balanced! Equal opposing moments. Explain your evidence.':`${l>r?'Left':'Right'} side falls. Try making the two moments equal.`}
function explain(){if(station===0){let n=values[1]-values[0];return `${values[1]} − ${values[0]} = ${n} N (right is positive). ${result()} ${index===4?'An opposing force slows the cart, then reverses it if it keeps acting.':''} This frictionless 50 kg cart has acceleration ${fmt(n/50)} m/s². Vertical forces cancel.`}if(station===1)return `A: ${values[0]} ÷ ${values[1]} = ${fmt(values[0]/values[1])} m/s. B: ${values[2]} ÷ ${values[3]} = ${fmt(values[2]/values[3])} m/s. A steeper distance–time line means greater speed. A horizontal segment means stopped. ${current().mode==='stop'?`A’s 2 s pause counts in total time; moving speed is ${fmt(values[0]/(values[1]-2))} m/s.`:'A straight rising line means constant speed.'} Runners stop at their own finish marks; compare gradients to compare speed.`;return index===4?`300 × 2 = 600 N m. For balance, 400 × d = 600, so d = 1.5 m on the opposite side. The forces need not be equal; their moments must be equal.`:`Left: ${values[0]} × ${values[1]} = ${fmt(values[0]*values[1])} N m. Right: ${values[2]} × ${values[3]} = ${fmt(values[2]*values[3])} N m. Equal opposing moments balance the beam. Distance is perpendicular to the force’s line of action; on this level beam it is the distance to the pivot. The animation shows a damped tilt, not a timed measurement.`}

function stageArt(){let defs=add('defs',{});[['sky','#f4f0ff','#dcecf7'],['cartPaint','#ffda7a','#f1ac4f'],['pivotPaint','#cab2ef','#9b8ac8']].forEach(([id,a,b])=>{let g=add('linearGradient',{id,x1:0,y1:0,x2:0,y2:1},'',defs);add('stop',{offset:'0%','stop-color':a},'',g);add('stop',{offset:'100%','stop-color':b},'',g)});add('rect',{width:1080,height:450,fill:'url(#sky)'});if(station===0){add('ellipse',{cx:540,cy:520,rx:740,ry:220,fill:'#e0dfef'});[90,990].forEach((x,i)=>{add('rect',{x:x-35,y:190,width:70,height:137,rx:22,fill:i?'#c0e9e0':'#e7cad4',stroke:'#fff','stroke-width':3});add('circle',{cx:x,cy:222,r:17,fill:'#ffffff90'});txt(x,230,i?'→':'←',25,i?'#338c7b':'#a3687d');for(let z=0;z<3;z++)line(x-15,260+z*14,x+15,260+z*14,'#ffffffa0',5)});for(let x=150;x<1000;x+=90){add('circle',{cx:x,cy:365,r:3,fill:'#b1abc8'});line(x,330,x,345,'#adacca',3)}txt(122,174,'PULL',13,'#a2788c');txt(958,174,'PULL',13,'#498d83')}
else if(station===1){add('rect',{x:22,y:51,width:548,height:274,rx:24,fill:'#bce3d5'});for(let x=40;x<560;x+=30){add('path',{d:`M${x} 63 l6 -6 l6 6`,fill:'none',stroke:'#a5d1bf','stroke-width':2})}add('rect',{x:591,y:7,width:459,height:425,rx:24,fill:'#ffffffc9',stroke:'#d0d4e7','stroke-width':2})}
else{cloud(155,92,1);cloud(910,115,.8);add('ellipse',{cx:535,cy:530,rx:770,ry:210,fill:'#d2e7d5'});[65,1015].forEach((x,i)=>{line(x,272,x,357,'#bca38b',9);add('circle',{cx:x,cy:260,r:41,fill:i?'#b2d8be':'#afcfda'});add('circle',{cx:x+17,cy:243,r:27,fill:i?'#c8e8c1':'#c1dfe5'});});add('ellipse',{cx:540,cy:375,rx:95,ry:12,fill:'#93b6a0',opacity:.35})}
[[42,65],[1030,52],[71,405],[1010,407]].forEach(([x,y],i)=>{let st=add('path',{d:`M${x} ${y-7} L${x+2} ${y-2} L${x+7} ${y} L${x+2} ${y+2} L${x} ${y+7} L${x-2} ${y+2} L${x-7} ${y} L${x-2} ${y-2}Z`,fill:i%2?'#b8a0d5':'#d9b875',class:'tiny-star'});st.style.animationDelay=i*.6+'s'})}
function cloud(x,y,s){let g=add('g',{transform:`translate(${x} ${y}) scale(${s})`,opacity:.8});add('path',{d:'M-60 20 Q-80 -8 -48 -15 Q-35 -50 -3 -28 Q26 -56 46 -15 Q85 -8 65 20Z',fill:'white'},'',g)}
function finishFlag(x,y){for(let a=0;a<4;a++)for(let b=0;b<3;b++)add('rect',{x:x+a*6,y:y+b*6,width:6,height:6,fill:(a+b)%2?'#fff':'#494563'})}
function celebrate(){let happy=station!==2||Math.abs(values[0]*values[1]-values[2]*values[3])<.01;for(let i=0;i<(happy?22:8);i++){let s=document.createElement('i');s.className='spark';s.style.cssText=`left:${540+Math.random()*200}px;top:470px;width:${6+Math.random()*7}px;height:7px;background:${['#ffc965','#89dfc3','#c5a5ff','#fa9eac'][i%4]};--dx:${(Math.random()-.5)*550}px;--dy:${-80-Math.random()*260}px`;if(!happy)s.style.background='#a6bee2';$('app').append(s);setTimeout(()=>s.remove(),1400)}}
let editIndex=0;
function editValue(i){if(running)return;let input=$('controls').querySelector(`[data-i="${i}"]`);if(input.disabled)return;editIndex=i;$('valueTitle').textContent=input.getAttribute('aria-label');['min','max','step'].forEach(a=>$('valueEntry')[a]=input[a]);$('valueEntry').value=values[i];$('valueEditor').showModal()}
function nudgeValue(sign){let e=$('valueEntry');e.value=fmt(Math.min(+e.max,Math.max(+e.min,+e.value+sign*+e.step)));tone(sign>0?600:400)}
$('lessValue').onclick=()=>nudgeValue(-1);$('moreValue').onclick=()=>nudgeValue(1);$('closeValue').onclick=()=>$('valueEditor').close();$('applyValue').onclick=()=>{let e=$('valueEntry');let v=+e.value;if(!Number.isFinite(v)||v<+e.min||v>+e.max){e.reportValidity();return}v=fmt(+e.min+Math.round((v-e.min)/e.step)*e.step);change(editIndex,v);controls();buttons();$('valueEditor').close();tone(700)};

$('predict').onclick=()=>{$('predictQ').textContent=current().q;$('predictionText').value='';$('prediction').showModal()};$('cancel').onclick=()=>$('prediction').close();$('commit').onclick=()=>{predicted=true;$('prediction').close();$('feedback').textContent='Prediction recorded. Test it and compare the evidence.';$('predict').textContent='✓ PREDICTED';buttons();tone(650)};
$('test').onclick=()=>{tested=true;running=true;elapsed=0;start=performance.now();$('feedback').textContent='⚡ Experiment running… Watch what changes!';document.querySelector('.lab').classList.add('testing');buttons();tone(740);let duration=station===1?Math.max(values[1],values[3]):station===0?2:2.5;function frame(now){elapsed=Math.min(duration,(now-start)/1000*(station===1?3:1));draw();if(elapsed<duration)anim=requestAnimationFrame(frame);else{running=false;document.querySelector('.lab').classList.remove('testing');$('feedback').classList.remove('observed');void $('feedback').offsetWidth;$('feedback').classList.add('observed');celebrate();completed.add(station+'-'+index);$('feedback').textContent=result();$('count').textContent=completed.size+' / 15 tested';$('bar').value=completed.size;buttons();if(station===2&&index===4){document.querySelectorAll('#controls input').forEach((a,i)=>a.disabled=i<3)}tone(880)}}anim=requestAnimationFrame(frame)};
$('reset').onclick=load;$('explain').onclick=()=>{$('explainText').textContent=explain();$('explainTitle').textContent='Observe → explain → try again';$('explanation').showModal()};$('closeExplain').onclick=()=>$('explanation').close();$('next').onclick=()=>{if(index<4)index++;else if(station<2){station++;index=0}else{$('explainTitle').textContent='🎉 Playground complete!';$('explainText').textContent='One final explanation: why does 400 N at 1.5 m balance 300 N at 2 m? Both moments are 600 N m. Share one discovery from each station.';$('explanation').showModal();return}load()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{station=+b.dataset.station;index=0;load()});$('pause').onclick=()=>{lessonRunning=!lessonRunning;lastTick=performance.now();$('pause').textContent=lessonRunning?'Ⅱ Pause':'▶ Start';tone()};$('duration').onchange=()=>{remaining=+$('duration').value*60;updateClock()};function updateClock(){$('clock').textContent=String(Math.floor(Math.ceil(remaining)/60)).padStart(2,'0')+':'+String(Math.ceil(remaining)%60).padStart(2,'0')}setInterval(()=>{if(lessonRunning){let now=performance.now();remaining=Math.max(0,remaining-(now-lastTick)/1000);lastTick=now;if(remaining===0){lessonRunning=false;$('pause').textContent='▶ Start';tone(440);$('feedback').textContent='Time! Finish your explanation and share your discoveries.'}updateClock()}},200);$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};load();
</script></body></html>
